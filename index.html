<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Court Case Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Pinned Supabase SDK Version to prevent unexpected breaking changes -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <h1>⚖️ Court Case Tracker</h1>
    <div class="nav-actions">
      <span id="user-display">Public View</span>
      <button id="login-btn" class="btn-primary" onclick="openLoginModal()">Login</button>
      <button id="logout-btn" class="btn-secondary" onclick="logout()" style="display:none;">Logout</button>
    </div>
  </header>

  <!-- Metrics Dashboard Cards -->
  <section class="stats-grid">
    <div class="stat-card">
      <h3>Total Active Cases</h3>
      <div id="stat-total" class="stat-value">0</div>
    </div>
    <div class="stat-card civil">
      <h3>Civil Cases</h3>
      <div id="stat-civil" class="stat-value">0</div>
    </div>
    <div class="stat-card criminal">
      <h3>Criminal Cases</h3>
      <div id="stat-criminal" class="stat-value">0</div>
    </div>
    <div class="stat-card urgent">
      <h3>Urgent (>30 Days)</h3>
      <div id="stat-urgent" class="stat-value">0</div>
    </div>
  </section>

  <!-- Filtering & Actions -->
  <section class="controls-card">
    <div class="tab-group">
      <button class="tab-btn active" onclick="switchTab('all', this)">All Active</button>
      <button class="tab-btn" onclick="switchTab('Civil', this)">Civil</button>
      <button class="tab-btn" onclick="switchTab('Criminal', this)">Criminal</button>
      <button class="tab-btn" onclick="switchTab('urgent', this)">Urgent</button>
      <button class="tab-btn" onclick="switchTab('archived', this)">Archived</button>
    </div>

    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search cases..." oninput="filterCases()">
      <select id="filter-status" onchange="filterCases()">
        <option value="ALL">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Closed">Closed</option>
      </select>
    </div>
  </section>

  <!-- Admin/Staff Form (Hidden for Public) -->
  <section id="admin-panel" class="controls-card" style="display:none;">
    <h3>Add New Case</h3>
    <form id="add-case-form" onsubmit="handleCreateCase(event)" style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;">
      <input type="text" id="case-num" placeholder="Case Number" required>
      <input type="text" id="title" placeholder="Case Title" required>
      <select id="category">
        <option value="Civil">Civil</option>
        <option value="Criminal">Criminal</option>
      </select>
      <select id="status">
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
      </select>
      <input type="date" id="hearing-date">
      <input type="text" id="details" placeholder="Case Details">
      <button type="submit" class="btn-primary">Add Case</button>
    </form>
  </section>

  <!-- Cases Table -->
  <section class="table-container">
    <table>
      <thead>
        <tr>
          <th>Case Number</th>
          <th>Category</th>
          <th>Title</th>
          <th>Status</th>
          <th>Days on Desk</th>
          <th>Next Hearing</th>
          <th>Details</th>
          <th class="actions-header" style="display:none;">Actions</th>
        </tr>
      </thead>
      <tbody id="cases-body">
        <tr><td colspan="8" style="text-align:center;">Loading cases...</td></tr>
      </tbody>
    </table>
  </section>

  <!-- Login Modal -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-content">
      <h3>Staff Login</h3>
      <form onsubmit="handleLogin(event)">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="btn-primary">Sign In</button>
        <button type="button" class="btn-secondary" onclick="closeLoginModal()">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Edit Case Modal -->
  <div id="edit-modal" class="modal-overlay">
    <div class="modal-content">
      <h3>Edit Case</h3>
      <form onsubmit="handleUpdateCase(event)">
        <input type="hidden" id="edit-case-id">
        <input type="text" id="edit-case-num" placeholder="Case Number" required>
        <input type="text" id="edit-title" placeholder="Case Title" required>
        <select id="edit-category">
          <option value="Civil">Civil</option>
          <option value="Criminal">Criminal</option>
        </select>
        <select id="edit-status">
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Closed">Closed</option>
        </select>
        <input type="date" id="edit-hearing-date">
        <textarea id="edit-details" placeholder="Case Details"></textarea>
        <button type="submit" class="btn-primary">Save Changes</button>
        <button type="button" class="btn-secondary" onclick="closeEditModal()">Cancel</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
