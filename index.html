<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Court Case Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Header & Authentication -->
  <header class="app-header">
    <div class="header-container">
      <h1>⚖️ Judicial Case Tracker</h1>
      <div class="user-controls">
        <span id="user-display">Public View</span>
        <button id="login-btn" class="btn-primary" onclick="openLoginModal()">🔑 Login</button>
        <button id="logout-btn" class="btn-secondary" onclick="logout()" style="display:none;">🚪 Logout</button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <!-- Dashboard Overview Stats -->
    <section class="stats-grid">
      <div class="stat-card">
        <h3>Active Cases</h3>
        <p id="stat-total">0</p>
      </div>
      <div class="stat-card civil">
        <h3>Civil Cases</h3>
        <p id="stat-civil">0</p>
      </div>
      <div class="stat-card criminal">
        <h3>Criminal Cases</h3>
        <p id="stat-criminal">0</p>
      </div>
      <div class="stat-card urgent">
        <h3>Over 30 Days on Desk</h3>
        <p id="stat-urgent">0</p>
      </div>
    </section>

    <!-- Admin Section (Staff & Judge Only) -->
    <section id="admin-panel" class="card" style="display: none;">
      <h2>➕ Add New Case</h2>
      <form id="add-case-form" onsubmit="handleCreateCase(event)">
        <div class="form-grid">
          <input type="text" id="case-num" placeholder="Case Number (e.g. WR/123/2026)" required />
          <input type="text" id="title" placeholder="Case Title (e.g. In the Matter of...)" required />
          <select id="category">
            <option value="Civil">Civil</option>
            <option value="Criminal">Criminal</option>
          </select>
          <select id="status">
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Adjourned">Adjourned</option>
            <option value="CMC">CMC</option>
            <option value="Trial">Trial</option>
            <option value="Sine Die">Sine Die</option>
            <option value="Judgment Delivered">Judgment Delivered</option>
            <option value="Consent Judgment">Consent Judgment</option>
            <option value="Struck Out">Struck Out</option>
            <option value="Convicted">Convicted</option>
            <option value="Closed">Closed</option>
            <option value="Dismissed">Dismissed</option>
          </select>
          <input type="date" id="hearing-date" />
          <input type="text" id="details" placeholder="Case Details / Remarks" />
        </div>
        <button type="submit" class="btn-primary" style="margin-top: 10px;">Save Case</button>
      </form>
    </section>

    <!-- Controls: Search & Tabs -->
    <section class="controls-bar">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('all', this)">All Active</button>
        <button class="tab-btn" onclick="switchTab('Civil', this)">Civil</button>
        <button class="tab-btn" onclick="switchTab('Criminal', this)">Criminal</button>
        <button class="tab-btn" onclick="switchTab('urgent', this)">🚨 Over 30 Days</button>
        <button class="tab-btn" onclick="switchTab('archived', this)">📁 Archived</button>
      </div>

      <div class="search-filter-group">
        <input type="text" id="search-input" placeholder="🔍 Search case number, title..." onkeyup="filterCases()" />
        <select id="filter-status" onchange="filterCases()">
          <option value="ALL">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Adjourned">Adjourned</option>
          <option value="CMC">CMC</option>
          <option value="Trial">Trial</option>
          <option value="Sine Die">Sine Die</option>
          <option value="Judgment Delivered">Judgment Delivered</option>
          <option value="Consent Judgment">Consent Judgment</option>
          <option value="Struck Out">Struck Out</option>
          <option value="Convicted">Convicted</option>
          <option value="Closed">Closed</option>
          <option value="Dismissed">Dismissed</option>
        </select>
        <button class="btn-secondary" onclick="exportToCSV()">📊 Export CSV</button>
      </div>
    </section>

    <!-- Cases Table -->
    <section class="card table-container">
      <table>
        <thead>
          <tr>
            <th>Case Number</th>
            <th>Category</th>
            <th>Title</th>
            <th>Status</th>
            <th>Desk Time</th>
            <th>Next Hearing</th>
            <th>Details</th>
            <th class="actions-header" style="display:none;">Actions</th>
          </tr>
        </thead>
        <tbody id="cases-body">
          <tr><td colspan="8" style="text-align:center;">Loading cases...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <!-- Login Modal -->
  <div id="login-modal" class="modal">
    <div class="modal-content card">
      <h2>Login to Case Tracker</h2>
      <form onsubmit="handleLogin(event)">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <div class="modal-actions">
          <button type="submit" class="btn-primary">Login</button>
          <button type="button" class="btn-secondary" onclick="closeLoginModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Case Modal (Judge Only) -->
  <div id="edit-modal" class="modal">
    <div class="modal-content card">
      <h2>Edit Court Case</h2>
      <form onsubmit="handleUpdateCase(event)">
        <input type="hidden" id="edit-case-id" />
        
        <label>Case Number</label>
        <input type="text" id="edit-case-num" required />
        
        <label>Case Title</label>
        <input type="text" id="edit-title" required />
        
        <label>Category</label>
        <select id="edit-category">
          <option value="Civil">Civil</option>
          <option value="Criminal">Criminal</option>
        </select>
        
        <label>Status</label>
        <select id="edit-status">
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Adjourned">Adjourned</option>
          <option value="CMC">CMC</option>
          <option value="Trial">Trial</option>
          <option value="Sine Die">Sine Die</option>
          <option value="Judgment Delivered">Judgment Delivered</option>
          <option value="Consent Judgment">Consent Judgment</option>
          <option value="Struck Out">Struck Out</option>
          <option value="Convicted">Convicted</option>
          <option value="Closed">Closed</option>
          <option value="Dismissed">Dismissed</option>
        </select>
        
        <label>Next Hearing Date</label>
        <input type="date" id="edit-hearing-date" />
        
        <label>Details</label>
        <textarea id="edit-details" rows="3"></textarea>
        
        <div class="modal-actions">
          <button type="submit" class="btn-primary">Save Changes</button>
          <button type="button" class="btn-secondary" onclick="closeEditModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
